[package]
name = "awesome_bar_lan_rust"
version = "0.1.0"
edition = "2021"
description = "Rust desktop host/join lobby for Beyond All Reason"
license = "MIT"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
